name: Windows Build

# Every run publishes a release named after the commit it was built from, so
# the trigger is every push rather than tags only. A `paths` filter is
# deliberately absent: it would also apply to tag pushes, and a tag on a commit
# that only touched the README would silently produce no release.
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # PyInstaller freezes whatever interpreter it runs under, so the runner's
    # CPython 3.12 and these wheels are exactly what ends up in the bundle.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    # One spec file, three executables, one shared _internal directory. See
    # packaging/bpsk-tools.spec for why it is a spec rather than three
    # `pyinstaller --onefile` calls.
    - name: Build bundle
      run: pyinstaller --noconfirm --clean packaging/bpsk-tools.spec

    - name: Verify the runtime is shared, not triplicated
      shell: bash
      run: |
        set -eu
        cd dist/bpsk-tools

        for exe in demod_analyzer.exe iq_splitter.exe make_test_signal.exe; do
          test -f "$exe" || { echo "::error::${exe} was not built"; exit 1; }
        done

        # The point of the single-COLLECT layout: python3*.dll, the Qt DLLs and
        # the numpy/scipy extension modules exist once, in _internal, and all
        # three .exe files load them from there. If a future change splits the
        # build back into per-tool bundles this is what notices -- the bundle
        # still works, it just quietly triples in size.
        for dll in python3*.dll Qt6Core.dll Qt6Widgets.dll; do
          n="$(find . -iname "$dll" | wc -l)"
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one $dll in the bundle, found $n"
            find . -iname "$dll"
            exit 1
          fi
        done

        # Qt refuses to start without its platform plugin, and it is the piece
        # most easily lost to an over-eager exclude in the spec.
        test -f _internal/PySide6/plugins/platforms/qwindows.dll \
          || { echo "::error::Qt windows platform plugin is missing"; exit 1; }

        du -sh . _internal

    - name: Smoke test
      shell: bash
      run: |
        set -eu
        cd dist/bpsk-tools

        # A real generate: exercises numpy, scipy and dsp.py end to end.
        ./make_test_signal.exe smoke.cs8 --format int8 --nsym 2000
        test -s smoke.cs8
        rm smoke.cs8

        # The GUIs have no batch mode, so they are started against Qt's
        # offscreen platform and killed. Surviving the timeout means the Qt
        # plugins loaded and the main window was constructed; an immediate exit
        # means an import or plugin failure, which is the failure mode worth
        # catching here.
        export QT_QPA_PLATFORM=offscreen
        for exe in demod_analyzer.exe iq_splitter.exe; do
          set +e
          timeout 25 "./$exe"
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "::error::${exe} exited on its own (rc=${rc}); it should have stayed up"
            exit 1
          fi
          echo "ok: ${exe} started"
        done

    - name: Package
      shell: bash
      run: |
        set -eu
        cp README.md dist/bpsk-tools/

        # recordings/ is copied in by the spec, next to the .exe files, so the
        # analyzer has something to open on a machine with no SDR attached. A
        # missing directory already fails the build step; this catches the
        # quieter case of a present but empty one, which is what a regression
        # in the .gitignore negation for *.cs8 / *.cu8 would leave behind.
        n="$(find dist/bpsk-tools/recordings -type f | wc -l)"
        test "$n" -gt 0 || { echo "::error::recordings/ is empty in the bundle"; exit 1; }
        echo "bundled ${n} reference captures"

        cd dist
        7z a -tzip ../bpsk-tools-windows-x64.zip bpsk-tools

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bpsk-tools-windows-x64
        path: bpsk-tools-windows-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: bpsk-tools-windows-x64
        path: release

    # The release is named and tagged after the commit, not after a version
    # tag, so every build is publishable and two builds never collide. A rerun
    # of the same commit updates its release in place rather than adding one.
    - name: Compute release name
      id: meta
      run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.short_sha }}
        name: ${{ steps.meta.outputs.short_sha }}
        body: |
          Windows 64-bit build of demod_analyzer, iq_splitter and
          make_test_signal. Unzip and run the .exe you want; the three tools
          share the Python and Qt runtime in `_internal`, so keep the folder
          together. Example captures are in `recordings`.

          Built from commit ${{ github.sha }} (${{ github.ref_name }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
