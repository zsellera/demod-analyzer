name: Windows Build

# Every run publishes a release named after the commit it was built from, so
# the trigger is every push rather than tags only. A `paths` filter is
# deliberately absent: it would also apply to tag pushes, and a tag on a commit
# that only touched the README would silently produce no release.
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # PyInstaller freezes whatever interpreter it runs under, so the runner's
    # CPython 3.12 and these wheels are exactly what ends up in the bundle.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    # One spec file, three executables, one shared _internal directory. See
    # packaging/demod-analyzer.spec for why it is a spec rather than three
    # `pyinstaller --onefile` calls.
    - name: Build bundle
      run: pyinstaller --noconfirm --clean packaging/demod-analyzer.spec

    - name: Package
      shell: bash
      run: |
        set -eu
        cp README.md dist/demod-analyzer/

        # The bundle is a binary distribution of a GPLv3 program, so the
        # licence travels with it -- section 4 requires the notice next to the
        # copies the user actually receives, which is the unzipped folder.
        cp LICENSE dist/demod-analyzer/
        test -s dist/demod-analyzer/LICENSE

        # recordings/ is copied in by the spec, next to the .exe files, so the
        # analyzer has something to open on a machine with no SDR attached. A
        # missing directory already fails the build step; this catches the
        # quieter case of a present but empty one, which is what a regression
        # in the .gitignore negation for *.cs8 / *.cu8 would leave behind.
        n="$(find dist/demod-analyzer/recordings -type f | wc -l)"
        test "$n" -gt 0 || { echo "::error::recordings/ is empty in the bundle"; exit 1; }
        echo "bundled ${n} reference captures"

        cd dist
        7z a -tzip ../demod-analyzer-windows-x64.zip demod-analyzer

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: demod-analyzer-windows-x64
        path: demod-analyzer-windows-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: demod-analyzer-windows-x64
        path: release

    # The release is named and tagged after the commit, not after a version
    # tag, so every build is publishable and two builds never collide. A rerun
    # of the same commit updates its release in place rather than adding one.
    - name: Compute release name
      id: meta
      run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.short_sha }}
        name: ${{ steps.meta.outputs.short_sha }}
        # Without this the release is created with no asset attached and the
        # body below points at a zip nobody can download.
        files: release/demod-analyzer-windows-x64.zip
        body: |
          Windows 64-bit build of demod_analyzer, iq_splitter and
          make_test_signal. Unzip and run the .exe you want; the three tools
          share the Python and Qt runtime in `_internal`, so keep the folder
          together. Example captures are in `recordings`.

          Free software under the GNU GPL v3 or later; the full licence is in
          `LICENSE` inside the zip. Source: this repository.

          Built from commit ${{ github.sha }} (${{ github.ref_name }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
